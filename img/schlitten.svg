<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 100"><style>
.sl-bein{transform-box:fill-box;transform-origin:50% 0;animation:sl-lauf .5s ease-in-out infinite}
.sl-b2{animation-delay:-.06s}.sl-b3{animation-delay:-.25s}.sl-b4{animation-delay:-.31s}
.sl-r2 .sl-bein{animation-duration:.5s;margin:0}
.sl-r2 .sl-b1{animation-delay:-.12s}.sl-r2 .sl-b2{animation-delay:-.18s}.sl-r2 .sl-b3{animation-delay:-.37s}.sl-r2 .sl-b4{animation-delay:-.43s}
@keyframes sl-lauf{0%,100%{transform:rotate(28deg)}50%{transform:rotate(-24deg)}}
.sl-ren{animation:sl-huepf .5s ease-in-out infinite}
.sl-r2{animation-delay:-.12s}
@keyframes sl-huepf{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.sl-arm{transform-box:fill-box;transform-origin:8% 15%;animation:sl-winken 7s ease-in-out infinite}
@keyframes sl-winken{0%,62%,96%,100%{transform:rotate(0)}68%{transform:rotate(-120deg)}72%{transform:rotate(-95deg)}76%{transform:rotate(-125deg)}80%{transform:rotate(-95deg)}84%{transform:rotate(-125deg)}88%{transform:rotate(-100deg)}}
.sl-kopf{transform-box:fill-box;transform-origin:50% 90%;animation:sl-nicken 7s ease-in-out infinite}
@keyframes sl-nicken{0%,62%,92%,100%{transform:rotate(0)}70%,86%{transform:rotate(-6deg)}}
.sl-nase{animation:sl-glimmen 1.4s ease-in-out infinite}
@keyframes sl-glimmen{0%,100%{opacity:.35}50%{opacity:.8}}
@media (prefers-reduced-motion:reduce){.sl-bein,.sl-ren,.sl-arm,.sl-kopf,.sl-nase{animation:none}}
